<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAPPY ANNIVERSARY MY LOVE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120a22;overflow:hidden;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff}
.px{font-family:'Press Start 2P','Courier New',monospace}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;background:#5ab0e8}
canvas{position:absolute;left:0;top:0}
#ov,#hud,#banner{position:absolute;inset:0;pointer-events:none}
#ov>*,#hud>*{pointer-events:auto}
#hud{font-size:32px;padding:14px 20px;display:none;inset:0 auto auto 0}
#hud span{margin-right:4px;filter:drop-shadow(0 3px 0 #0006)}
#lvl{position:absolute;right:20px;top:14px;text-align:right;font-size:11px;line-height:1.9;color:#ffd36b;text-shadow:2px 2px 0 #3b1a40;display:none}
.btn{font:700 22px 'Trebuchet MS',sans-serif;padding:14px 34px;border:4px solid #8c1c4f;background:#ff7fb0;color:#fff;border-radius:12px;box-shadow:0 6px 0 #8c1c4f;cursor:pointer;margin-top:14px}
.btn:hover{background:#ff6aa2}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8c1c4f}
.abs{position:absolute;transition-property:left,top;transition-timing-function:ease-out;transition-duration:.12s;margin:0;z-index:5}
.no{background:#999;border-color:#555;box-shadow:0 6px 0 #555;pointer-events:none!important;cursor:not-allowed}
.panel{position:absolute;left:220px;top:22px;width:840px;max-height:440px;overflow:auto;background:rgba(40,20,60,.93);border:4px solid #ffd36b;border-radius:14px;padding:18px 24px;box-shadow:0 8px 0 #0006;animation:pop .3s}
.panel.tall{top:14px;max-height:680px}
.panel h2{font:16px/1.75 'Press Start 2P',monospace;margin:6px 0 14px;color:#fff3c4}
.qn{font-size:13px;color:#ffd36b;letter-spacing:2px}
.opt{display:block;width:100%;margin:8px 0;padding:11px 14px;font:600 20px 'Trebuchet MS',sans-serif;background:#ffe9a8;color:#3b1a40;border:3px solid #b8863b;border-radius:8px;cursor:pointer;text-align:left}
.opt:hover{background:#fff3c4}.opt.bad{background:#ff8a8a;opacity:.55;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid .opt{margin:0;font-size:15px;padding:9px 10px}.opt.on{background:#ff9ec7;border-color:#c2185b}
.fb{min-height:30px;color:#ff9a9a;font:700 22px 'Press Start 2P',monospace;margin-top:8px}
.shake{animation:shake .35s}.big{font-size:24px;line-height:1.5;margin:10px 0}
input{width:100%;font:600 22px 'Trebuchet MS',sans-serif;padding:12px;border-radius:8px;border:3px solid #b8863b}
.hint{color:#ff9a9a;font-family:'Press Start 2P',monospace;margin-top:10px;line-height:1.3}
.story{position:absolute;left:210px;top:170px;width:860px;background:#fff3d6;color:#3b1a40;border:6px solid #b8863b;border-radius:16px;padding:34px 40px;text-align:center;animation:pop .5s;box-shadow:0 10px 0 #0007}
.story p{font-size:25px;line-height:1.6;margin:0}
.title{position:absolute;left:0;right:0;top:70px;text-align:center;font:34px/1.5 'Press Start 2P',monospace;color:#ffd36b;text-shadow:4px 4px 0 #8c1c4f}
.sub{position:absolute;left:0;right:0;top:200px;text-align:center;font:15px/2.2 'Press Start 2P',monospace;color:#fff;text-shadow:2px 2px 0 #3b1a40}
.msg{position:absolute;left:0;right:0;top:395px;text-align:center;font:700 26px 'Trebuchet MS',sans-serif;color:#fff;text-shadow:2px 2px 0 #3b1a40;min-height:34px}
#banner{display:none;text-align:center;padding-top:230px;font-family:'Press Start 2P',monospace;text-shadow:3px 3px 0 #3b1a40;animation:fadeOut 4s forwards}
.go{position:absolute;inset:0;background:rgba(10,0,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center}
.go img{max-height:390px;max-width:700px;border:6px solid #fff;border-radius:6px}.go h1{font:46px 'Press Start 2P',monospace;color:#ff6a6a;margin:20px 0 4px;text-shadow:4px 4px 0 #000}
.lw{position:absolute;inset:0;background:rgba(20,8,30,.82);overflow:auto;text-align:center;animation:fadeIn 1s}
.let{height:640px;width:auto;margin:34px auto 10px;display:block;cursor:zoom-in;box-shadow:0 0 70px 10px #ffd36b;animation:rise 1.8s ease-out}
.zoom .let{height:1800px;cursor:zoom-out}
.cont{position:absolute;right:30px;bottom:22px;animation:fadeIn 1s 2s both}
.hz{position:absolute;left:30px;bottom:34px;color:#ffe9a8;font-size:15px}
.ck{position:absolute;inset:0;background:linear-gradient(#2b1055 0%,#7b2a74 35%,#ff6b6b 62%,#ffb347 82%,#ffd36b);overflow:hidden;animation:fadeIn 1.5s}
.sun{position:absolute;left:560px;top:420px;width:170px;height:170px;background:#fff3a0;clip-path:polygon(30% 0,70% 0,70% 10%,85% 10%,85% 25%,100% 25%,100% 75%,85% 75%,85% 90%,70% 90%,70% 100%,30% 100%,30% 90%,15% 90%,15% 75%,0 75%,0 25%,15% 25%,15% 10%,30% 10%)}
.h1{position:absolute;left:-150px;bottom:-150px;width:850px;height:320px;background:#3a1450;border-radius:50%}
.h2{position:absolute;right:-150px;bottom:-170px;width:950px;height:320px;background:#24093a;border-radius:50%}
.star{position:absolute;width:4px;height:4px;background:#fff;animation:tw 2s infinite alternate}
.cb{display:inline-block;margin:0 10px;background:rgba(30,10,50,.78);border:4px solid #ffd36b;padding:16px 8px;width:190px;text-align:center}
.cb b{display:block;font:40px 'Press Start 2P',monospace;color:#fff3c4}.cb i{font:normal 13px 'Press Start 2P',monospace;color:#ffd36b;display:block;margin-top:12px}
#mob{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:30px;font:18px/1.8 'Press Start 2P',monospace;color:#ffd36b}
@keyframes pop{from{opacity:0;transform:translateY(-24px)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{0%,70%{opacity:1}100%{opacity:0}}
@keyframes rise{from{transform:translateY(320px) scale(.15);opacity:0}}
@keyframes tw{to{opacity:.2}}
</style></head><body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas><div id="hud" class="px"></div><div id="lvl"></div><div id="banner"></div><div id="ov"></div></div>

if(!q.ty){const fb=h('div','fb','');q.o.forEach((o,k)=>{const b=h('button','opt',o,p);b.onclick=()=>{if(k==q.a)go();else{lose();b.classList.add('bad');fb.textContent=q.w||'';p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}}});p.appendChild(fb)}
else if(q.ty=='multi'){const g=h('div','grid',0,p);q.o.forEach(o=>{const b=h('button','opt',o,g);b.onclick=()=>b.classList.toggle('on')});const nb=h('button','btn','NEXT',p);nb.onclick=()=>{p.innerHTML='';h('p','big',q.msg,p);const c=h('button','btn','CONTINUE',p);c.onclick=go}}
else if(q.ty=='text'){const inp=h('input',0,null,p);inp.placeholder='type your answer...';const sb=h('button','btn','SUBMIT',p);const hint=h('div','hint','',p);let tries=0;
const chk=()=>{if(inp.value.trim().toLowerCase()==='blue'){go();return}lose();tries++;hint.textContent='the color';hint.style.fontSize=(16+tries*9)+'px';inp.select()};sb.onclick=chk;inp.onkeydown=e=>{if(e.key=='Enter')chk()};setTimeout(()=>inp.focus(),50)}
else if(q.ty=='dlg'){let k=0;const m=h('p','big',q.m[0],p);const nb=h('button','btn','NEXT',p);nb.onclick=()=>{k++;if(k<q.m.length)m.textContent=q.m[k];else go()}}
else{p.style.maxHeight='140px';const y=h('button','btn abs','YES',ov);y.style.left='430px';y.style.top='520px';const n=h('button','btn abs no','NO',ov);n.disabled=true;n.style.left='720px';n.style.top='520px';evader(y,8,null,true);y.addEventListener('click',go)}}
function clockScreen(){S.phase='anniversaryClock';ov.innerHTML='';showHud(0);const c=h('div','ck',0,ov);for(let i=0;i<45;i++){const s=h('div','star',0,c);s.style.left=Math.random()*W+'px';s.style.top=Math.random()*330+'px';s.style.animationDelay=Math.random()*2+'s'}
h('div','sun',0,c);h('div','h1',0,c);h('div','h2',0,c);const d=h('img',0,0,c);d.src=SRC.duck;d.style.cssText='position:absolute;right:250px;bottom:118px;height:92px';
h('div','title','HAPPY ANNIVERSARY MY LOVE',c).style.top='50px';const r=h('div',0,0,c);r.style.cssText='position:absolute;left:0;right:0;top:190px;text-align:center';const nums={};[['d','DAYS'],['h','HOURS'],['m','MINUTES'],['s','SECONDS']].forEach(([k,l])=>{const b=h('div','cb',0,r);nums[k]=h('b',0,'0',b);h('i',0,l,b)});
const m=h('div','sub','And the clock keeps counting...',c);m.style.top='370px';m.style.fontSize='20px';
const tick=()=>{const ms=Math.max(0,Date.now()-START_TS);nums.d.textContent=Math.floor(ms/864e5);nums.h.textContent=Math.floor(ms/36e5)%24;nums.m.textContent=Math.floor(ms/6e4)%60;nums.s.textContent=Math.floor(ms/1e3)%60};tick();setInterval(tick,1000)}
function gameOver(){S.phase='gameOver';ov.innerHTML='';const o=h('div','go',0,ov);h('img',0,0,o).src=SRC.over;h('h1',0,'JAK 3ISSA',o);h('button','btn','fhmt klch ✋🏼🪟',o).onclick=reset}
function showLetter(){S.phase='letter';const lw=h('div','lw',0,ov);const im=h('img','let',0,lw);im.src=SRC.letter;im.onclick=()=>lw.classList.toggle('zoom');h('div','hz','click the letter to zoom',ov);h('button','btn cont','CONTINUE',ov).onclick=clockScreen}
const dist=()=>150+S.hearts*30;
function follow(dt){const t=S.duck.x-dist();S.did+=(t-S.did)*Math.min(1,2.5*dt)}
function upd(dt){const s=S,d=s.duck,p=s.phase;s.t+=dt;
for(let i=0;i<N;i++)if(s.f[i]>=0&&s.f[i]<1)s.f[i]=Math.min(1,s.f[i]+dt*2);
if(p=='playing'){d.x+=240*dt;if(d.x>=stopX(s.q)){d.x=stopX(s.q);s.phase='question';showQ(s.q)}follow(dt)}
else if(p=='jumping'){d.x+=380*dt;d.vy-=1500*dt;d.h+=d.vy*dt;if(d.h<=0&&d.vy<0){d.h=0;d.vy=0;s.f[s.q]=0;s.q++;if(s.q>=N){s.phase='finalEscape';s.ft=0}else s.phase='playing'}follow(dt)}
else if(p=='caught'){s.ct+=dt;s.did+=(d.x-80-s.did)*Math.min(1,5*dt);if(s.ct>1.2)gameOver()}
else if(p=='finalEscape'){s.ft+=dt;d.x+=260*dt;s.did+=120*dt*Math.max(0,1-s.ft/.6);if(d.x>=CHEST-170){d.x=CHEST-170;s.phase='treasure';s.tt=0}}
if(p=='treasure'||p=='letter'){s.tt+=dt;s.lid=Math.min(1,Math.max(0,(s.tt-.6)/1));if(s.tt>1.6&&s.tt<6)for(let i=0;i<6;i++)s.parts.push({x:CHEST+60+Math.random()*50-25,y:GY-70,vx:Math.random()*400-200,vy:-200-Math.random()*400,l:1.6,c:Math.random()<.5?'#ffd36b':'#fff3a0'});if(s.tt>2.2&&p=='treasure')showLetter()}
s.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.l-=dt});s.parts=s.parts.filter(q=>q.l>0);
s.cam+=(Math.max(0,d.x-520)-s.cam)*Math.min(1,8*dt)}
function sprite(im,x,y,hh,rot){const w=im.width/im.height*hh;ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.drawImage(im,-w/2,-hh,w,hh);ctx.restore()}
function gapAt(wx){for(let i=0;i<N;i++)if(wx>=gx(i)&&wx<gx(i)+GW)return i;return -1}
function draw(){const s=S,d=s.duck,cam=s.cam;ctx.imageSmoothingEnabled=false;ctx.fillStyle='#5ab0e8';ctx.fillRect(0,0,W,H);
const bw=IM.bg.width*H/IM.bg.height,off=cam*.15;for(let i=Math.floor(off/bw);i<=Math.floor(off/bw)+2;i++){const x=i*bw-off;ctx.save();if(i%2){ctx.translate(x+bw,0);ctx.scale(-1,1);ctx.drawImage(IM.bg,0,0,bw,H)}else ctx.drawImage(IM.bg,x,0,bw,H);ctx.restore()}
for(let wx=Math.floor(cam/32)*32;wx<cam+W+32;wx+=32){const sx=Math.round(wx-cam),g=gapAt(wx+16);let o=0;
if(g>=0&&s.f[g]<1){ctx.fillStyle='#1b0f2e';ctx.fillRect(sx,GY,32,H-GY);ctx.fillStyle='#2d1b4a';ctx.fillRect(sx,GY+120,32,H);if(s.f[g]<0)continue;o=Math.pow(1-s.f[g],2)*220}
ctx.fillStyle='#8a5a2b';ctx.fillRect(sx,GY+18+o,32,H);ctx.fillStyle='#6f4520';const a=(wx/32)&1;ctx.fillRect(sx+(a?16:0),GY+34+o,16,16);ctx.fillRect(sx+(a?0:16),GY+66+o,16,16);ctx.fillRect(sx+(a?16:0),GY+98+o,16,16);
ctx.fillStyle='#5cbf3a';ctx.fillRect(sx,GY+o,32,18);ctx.fillStyle='#8ee05a';ctx.fillRect(sx,GY+o,32,6);ctx.fillStyle='#3e9a2a';ctx.fillRect(sx+((wx/32*7)%3)*8,GY+10+o,6,6)}
const cx=CHEST-cam;if(cx>-200&&cx<W+100){if(s.lid>0){const gr=ctx.createRadialGradient(cx+60,GY-40,10,cx+60,GY-40,200);gr.addColorStop(0,'rgba(255,230,120,.8)');gr.addColorStop(1,'rgba(255,230,120,0)');ctx.fillStyle=gr;ctx.fillRect(cx-150,GY-250,420,300)}
ctx.fillStyle='#8b5a2b';ctx.fillRect(cx,GY-60,120,60);ctx.fillStyle='#ffd36b';ctx.fillRect(cx,GY-60,120,8);ctx.fillRect(cx+20,GY-60,10,60);ctx.fillRect(cx+90,GY-60,10,60);ctx.fillRect(cx+50,GY-45,20,18);
ctx.save();ctx.translate(cx,GY-60);ctx.rotate(-s.lid*1.2);ctx.fillStyle='#a36a33';ctx.fillRect(0,-30,120,30);ctx.fillStyle='#ffd36b';ctx.fillRect(0,-30,120,6);ctx.fillRect(20,-30,10,30);ctx.fillRect(90,-30,10,30);ctx.restore()}
ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
const run=['playing','jumping','finalEscape'].includes(s.phase),caught=s.phase=='caught';
ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(d.x-cam,GY+2,34*(1-d.h/400),7,0,0,7);ctx.fill();
const fe=['finalEscape','treasure','letter'].includes(s.phase);
const dbob=(run&&!fe||caught)?Math.abs(Math.sin(s.t*12))*8:0;const dsx=s.did-cam;
if(fe)sprite(IM.did,dsx,GY,170,-Math.min(1,s.ft*2.5)*1.45);else sprite(IM.did,dsx,GY-dbob,170,Math.sin(s.t*12)*.05*(run||caught?1:0));
if(fe&&s.ft>.5){ctx.font='34px serif';ctx.fillText('💫',dsx-60,GY-150+Math.sin(s.t*6)*6)}
const bob=run&&d.h==0?Math.abs(Math.sin(s.t*14))*8:0;sprite(IM.duck,d.x-cam,GY-d.h-bob,84,run?Math.sin(s.t*14)*.09:0);
s.parts.forEach(q=>{ctx.globalAlpha=Math.min(1,q.l);ctx.fillStyle=q.c;ctx.fillRect(q.x-cam,q.y,7,7)});ctx.globalAlpha=1}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;upd(dt);draw();requestAnimationFrame(loop)}
Promise.all(['duck','did','bg'].map(k=>new Promise(r=>{const i=new Image();i.onload=()=>{IM[k]=i;r()};i.src=SRC[k]}))).then(()=>{S=ns();story(0);requestAnimationFrame(loop)});
}
</script></body></html>
